<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        <script src="https://rawgit.com/mayognaise/aframe-gif-shader/master/dist/aframe-gif-shader.min.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
            >
                <a-image
                    src="assets/asset.png"
                    scale="1 1 1"
                    class="clickable"
                    rotation="-90 0 0"
                    gesture-handler
                ></a-image>

                <!-- Fondo blanco para el texto, ubicado al costado (eje X) de la molecula -->
                <a-plane
                    position="0.55 0.02 0"
                    rotation="-90 0 0"
                    width="0.6"
                    height="0.16"
                    color="#ffffff"
                    material="shader: flat; side: double"
                ></a-plane>

                <a-text
                    value="&#961;=1 g/cm3"
                    position="0.55 0.03 0"
                    rotation="-90 0 0"
                    align="center"
                    color="#000000"
                    width="1.4"
                    baseline="center"
                    side="double"
                ></a-text>

                <!-- GIF animado (vibracion simetrica) ubicado al otro costado de la molecula -->
                <a-plane
                    position="-0.55 0.02 0"
                    rotation="-90 0 0"
                    width="0.5"
                    height="0.5"
                    material="shader: gif; src: url(assets/Symmetrical_stretching.gif); side: double"
                ></a-plane>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
